<!DOCTYPE html>
<html>
  <head>
    <title>Project biologi</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="biologi-body">
    <nav class="biologi-nav">
      <ul>
        <li><a class="main-page-link" href="index.html">&lt; Back to Main page</a></li>
      </ul>
    </nav>
    <header class="biologi-header">
      <h2>Biology Project {Experiment}</h2>
      <h1>Lab Rat <strong>Dissection</strong><h1>
    </header>
    <hr>
    <main>
      <div class="slideshow">
        <button  style="background-image: url(imgs/buttons/button-left.svg);"></button>
        <img src="imgs/biologi-xi-slides/slide-1.png" alt="Slide">
        <button  style="background-image: url(imgs/buttons/button-right.svg);"></button>
      </div>
      <hr>
      <div style="color: #e5db24;padding: 20px;" class="biologi-xi-explanation-div">
        <p>This is a <strong>biology</strong> experiment about the digestive system topic, although we got to learn the other systems aswell</p>
        <p>I did this project along with my other friends : </p>
        <ul>
          <li><p>Justin</p></li>
          <li><p>Aziiz</p></li>
          <li><p>Kevin</p></li>
          <li><p>Owen</p></li>
          <li><p>Rifat</p></li>
        </ul>
      </div>
    </main>

    <script>
const images = [
    "imgs/biologi-xi-slides/slide-1.png",
    "imgs/biologi-xi-slides/slide-2.png",
    "imgs/biologi-xi-slides/slide-3.png",
    "imgs/biologi-xi-slides/slide-4.png",
    "imgs/biologi-xi-slides/slide-5.png",
    "imgs/biologi-xi-slides/slide-6.png",
    "imgs/biologi-xi-slides/slide-7.png",
    "imgs/biologi-xi-slides/slide-8.png",
    "imgs/biologi-xi-slides/slide-9.png",
    "imgs/biologi-xi-slides/slide-10.png",
    "imgs/biologi-xi-slides/slide-11.png"
];

let currentImage = 0;

const slide = document.querySelector(".slideshow img");
const buttons = document.querySelectorAll(".slideshow button");

buttons[0].addEventListener("click", () => {
    if (currentImage > 0) {
        currentImage--;
        slide.src = images[currentImage];
    }
});

buttons[1].addEventListener("click", () => {
    if (currentImage < images.length - 1) {
        currentImage++;
        slide.src = images[currentImage];
    }
});
</script>
  </body>
</html>
